<ng-container *transloco="let t; prefix: 'layout'">
  <div class="app-layout min-h-screen flex relative lg:static bg-surface-50 dark:bg-surface-950">
    <aside
      id="app-sidebar"
      class="w-[280px] bg-primary h-screen hidden lg:block shrink-0 absolute lg:sticky left-0 top-0 z-10 select-none"
      [attr.aria-label]="t('sidebar')"
    >
      <div class="flex flex-col h-full">
        <div class="p-4 flex items-center gap-4">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="43"
            height="43"
            viewBox="0 0 43 43"
            fill="none"
            class="w-10 h-10"
            aria-hidden="true"
          >
            <path
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M21.5 42.0498C33.098 42.0498 42.5 32.6477 42.5 21.0498C42.5 9.45183 33.098 0.0498047 21.5 0.0498047C9.902 0.0498047 0.5 9.45183 0.5 21.0498C0.5 32.6477 9.902 42.0498 21.5 42.0498ZM28.0513 9.83248C28.3702 8.69975 27.2709 8.02994 26.267 8.74516L12.2528 18.7288C11.164 19.5045 11.3353 21.0498 12.51 21.0498H16.2003V21.0212H23.926L17.5323 23.089L14.9487 32.2671C14.6299 33.3999 15.729 34.0697 16.733 33.3544L30.7472 23.3708C31.836 22.5951 31.6646 21.0498 30.49 21.0498H24.8937L28.0513 9.83248Z"
              class="fill-primary-contrast"
            />
          </svg>
          <span class="text-lg font-semibold leading-tight text-primary-contrast">{{ t('appName') }}</span>
        </div>

        <nav class="overflow-y-auto flex-1 p-2 flex flex-col gap-4" [attr.aria-label]="t('mainNavigation')">
          @for (group of navGroups; track group.labelKey; let isFirst = $first) {
            @if (!isFirst) {
              <hr class="border-t border-primary-400 dark:border-primary-300 my-0" />
            }
            <ul class="list-none m-0 p-0 flex flex-col">
              <li>
                <button
                  type="button"
                  pStyleClass="@next"
                  enterFromClass="hidden"
                  enterActiveClass="animate-slidedown"
                  leaveToClass="hidden"
                  leaveActiveClass="animate-slideup"
                  class="w-full flex items-center cursor-pointer p-3 gap-4 rounded-lg hover:bg-primary-emphasis transition-colors duration-150"
                >
                  <span class="font-semibold text-base leading-tight text-primary-contrast">{{ t('nav.' + group.labelKey) }}</span>
                  <i class="pi pi-angle-down text-base! leading-none! text-primary-contrast ml-auto" aria-hidden="true"></i>
                </button>
                <ul class="list-none p-0 m-0 overflow-hidden flex flex-col gap-1">
                  @for (item of group.items; track item.route) {
                    <li>
                      <a
                        routerLinkActive="bg-primary-emphasis"
                        ariaCurrentWhenActive="page"
                        class="flex items-center cursor-pointer p-3 gap-2 rounded-lg text-primary-contrast hover:bg-primary-emphasis transition-colors duration-150"
                        [routerLink]="item.route"
                        [routerLinkActiveOptions]="{ exact: item.isExact }"
                      >
                        <i class="text-base! leading-none! text-primary-contrast" [class]="item.icon" aria-hidden="true"></i>
                        <span class="font-medium text-base leading-tight">{{ t('nav.' + item.labelKey) }}</span>
                      </a>
                    </li>
                  }
                </ul>
              </li>
            </ul>
          }
        </nav>

        <div class="py-2 mt-auto border-t border-primary-400 dark:border-primary-300">
          <div class="flex items-center p-2 gap-2 text-primary-contrast">
            <p-avatar icon="pi pi-user" shape="circle" />
            <span class="font-medium text-base leading-tight">{{ t('user') }}</span>
          </div>
        </div>
      </div>
    </aside>

    <div class="min-h-screen flex flex-col relative flex-auto min-w-0">
      <header
        class="flex justify-between items-center py-4 px-8 bg-surface-0 dark:bg-surface-900 border-b border-surface-200 dark:border-surface-700 relative lg:static"
      >
        <div class="flex items-center">
          <button
            type="button"
            pStyleClass="#app-sidebar"
            enterFromClass="hidden"
            enterActiveClass="animate-fadeinleft"
            leaveToClass="hidden"
            leaveActiveClass="animate-fadeoutleft"
            resizeSelector=".app-layout"
            class="cursor-pointer block lg:hidden text-surface-700 dark:text-surface-100 mr-4"
            [hideOnOutsideClick]="true"
            [hideOnResize]="true"
            [attr.aria-label]="t('toggleMenu')"
          >
            <i class="pi pi-bars text-xl!" aria-hidden="true"></i>
          </button>
        </div>
        <p-avatar icon="pi pi-user" shape="circle" [ariaLabel]="t('user')" />
      </header>

      <main class="p-8 flex flex-col flex-auto">
        <router-outlet />
      </main>
    </div>
  </div>
</ng-container>
